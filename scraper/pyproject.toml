[build-system]
requires = ["hatchling", "hatch-openzim>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "youtube2zim"
requires-python = ">=3.14,<3.15"
description = "Make ZIM file from a Youtube channel, user or playlist(s)"
dependencies = [
  "python-slugify==9.2.0",
  "yt-dlp[default,curl_cffi]", # youtube-dl should be updated as frequently as possible
  "python-dateutil==2.9.0.post0",
  "jinja2==3.1.6",
  "zimscraperlib==5.6.0",
  "requests==2.34.2",
  "kiwixstorage==0.11.0",
  "pif==0.8.2",
  "pydantic==2.14.4",
  "pyhumps==3.8.0",
  "schedule==1.2.2",
  "isodate==0.7.2"
]
dynamic = ["authors", "classifiers", "keywords", "license", "readme", "version", "urls"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.openzim-metadata]
kind = "scraper"
additional-keywords = ["youtube"]
readme = "../README.md"

[project.optional-dependencies]
scripts = ["invoke==3.0.3"]
qa = ["ruff==0.17.6", "pyright==1.1.414"]
test = ["pytest==9.2.0", "coverage==7.17.5"]
dev = [
  "pre-commit==4.7.0",
  "debugpy==1.8.22",
  "youtube2zim[scripts]",
  "youtube2zim[qa]",
  "youtube2zim[test]",
  "humanfriendly==10.0"
]

[project.scripts]
youtube2zim = "youtube2zim.__main__:main"
youtube2zim-playlists = "youtube2zim.playlists.__main__:main"

[tool.hatch.version]
path = "src/youtube2zim/__about__.py"

[tool.hatch.build]
exclude = ["/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube2zim"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.test]
features = ["scripts", "test"]

[tool.hatch.envs.test.scripts]
run = "inv test --args '{args}'"
run-cov = "inv test-cov --args '{args}'"
report-cov = "inv report-cov"
coverage = "inv coverage --args '{args}'"
html = "inv coverage --html --args '{args}'"

[tool.hatch.envs.qa]
template = "qa"
python = "py314"
skip-install = false
features = ["scripts", "qa", "test"]

[tool.hatch.envs.qa.scripts]
check-lint = "inv check-lint --args '{args}'"
check-format = "inv check-format --args '{args}'"
check-type = "inv check-type --args '{args}'"
check-all = "inv check-all --args '{args}'"
fix-format = "inv fix-format --args '{args}'"
fix-lint = "inv fix-lint --args '{args}'"
fix-all = "inv fix-all --args '{args}'"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]
exclude = ["src/youtube2zim/zimui", ".hatch"]

[tool.ruff.lint]
select = [
  "A", # flake8-builtins
  # "ANN",  # flake8-annotations
  "ARG", # flake8-unused-arguments
  # "ASYNC",  # flake8-async
  "B", # flake8-bugbear
  # "BLE",  # flake8-blind-except
  "C4",  # flake8-comprehensions
  "C90", # mccabe
  # "COM",  # flake8-commas
  # "D",  # pydocstyle
  # "DJ",  # flake8-django
  "DTZ", # flake8-datetimez
  "E",   # pycodestyle (default)
  "EM",  # flake8-errmsg
  # "ERA",  # eradicate
  # "EXE",  # flake8-executable
  "F", # Pyflakes (default)
  # "FA",  # flake8-future-annotations
  "FBT", # flake8-boolean-trap
  # "FLY",  # flynt
  # "G",  # flake8-logging-format
  "I",   # isort
  "ICN", # flake8-import-conventions
  # "INP",  # flake8-no-pep420
  # "INT",  # flake8-gettext
  "ISC", # flake8-implicit-str-concat
  "N",   # pep8-naming
  # "NPY",  # NumPy-specific rules
  # "PD",  # pandas-vet
  # "PGH",  # pygrep-hooks
  # "PIE",  # flake8-pie
  # "PL",  # Pylint
  "PLC", # Pylint: Convention
  "PLE", # Pylint: Error
  "PLR", # Pylint: Refactor
  "PLW", # Pylint: Warning
  # "PT",  # flake8-pytest-style
  # "PTH",  # flake8-use-pathlib
  # "PYI",  # flake8-pyi
  "Q", # flake8-quotes
  # "RET",  # flake8-return
  # "RSE",  # flake8-raise
  "RUF", # Ruff-specific rules
  "S",   # flake8-bandit
  # "SIM",  # flake8-simplify
  # "SLF",  # flake8-self
  "T10", # flake8-debugger
  "T20", # flake8-print
  # "TCH",  # flake8-type-checking
  # "TD",  # flake8-todos
  "TID", # flake8-tidy-imports
  # "TRY",  # tryceratops
  "UP",  # pyupgrade
  "W",   # pycodestyle
  "YTT", # flake8-2020
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow use of date.today
  "DTZ011",
  # Remove flake8-errmsg since we consider they bloat the code and provide limited value
  "EM",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105",
  "S106",
  "S107",
  # Ignore warnings on subprocess.run / popen
  "S603",
  # Ignore complexity
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["youtube2zim"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
"tests-integration/**/*" = ["PLR2004", "S101", "TID252"]

[tool.pytest.ini_options]
minversion = "7.3"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.coverage.paths]
great_project = ["src/youtube2zim"]
tests = ["tests"]

[tool.coverage.run]
source_pkgs = ["youtube2zim"]
branch = true
parallel = true
omit = ["src/youtube2zim/__about__.py"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pyright]
include = ["src", "tests", "tasks.py"]
exclude = [".env/**", ".venv/**", "src/youtube2zim/zimui", ".hatch"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
disableBytesTypePromotions = true
