name: QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-scraper-qa-amd64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[qa,scripts,test]

      - name: Check linting
        working-directory: scraper
        run: inv check-lint

      - name: Check formatting
        working-directory: scraper
        run: inv check-format

      - name: Check type
        working-directory: scraper
        run: inv check-type

  check-scraper-qa-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: scraper/pyproject.toml

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[qa,scripts,test]

      - name: Check linting
        working-directory: scraper
        run: inv check-lint

      - name: Check formatting
        working-directory: scraper
        run: inv check-format

      - name: Check type
        working-directory: scraper
        run: inv check-type

  check-zimui-qa-amd64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: zimui/.node-version

      - name: Install JS dependencies
        working-directory: zimui
        run: |
          yarn install
      - name: Check prettier
        working-directory: zimui
        run: |
          yarn format-check
      - name: Check eslint
        working-directory: zimui
        run: |
          yarn lint-check

  check-zimui-qa-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: zimui/.node-version

      - name: Install JS dependencies
        working-directory: zimui
        run: |
          yarn install
      - name: Check prettier
        working-directory: zimui
        run: |
          yarn format-check
      - name: Check eslint
        working-directory: zimui
        run: |
          yarn lint-check
