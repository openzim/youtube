name: Daily tests

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  # Runs on the self-hosted runner, not a GitHub-hosted one: see the comment on
  # the equivalent job in Tests.yml for why.
  run-integration-tests:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: docker system prune -af

      - name: Ensure we can build the Docker image
        run: |
          docker build -t youtube2zim .

      - name: Run scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPTIMIZATION_CACHE_URL: ${{ secrets.OPTIMIZATION_CACHE_URL }}
        run: |
          docker run -v $PWD/output:/output youtube2zim youtube2zim --api-key "$YOUTUBE_API_KEY" --optimization-cache "$OPTIMIZATION_CACHE_URL" --id "UC8elThf5TGMpQfQc_VE917Q" --name "tests_en_openzim-testing" --zim-file "openZIM_testing.zim" --tags "tEsTing,x-mark:yes" || EXIT_CODE=$?
          sudo chown -R $(id -u -n):$(id -g -n) $PWD/output
          exit ${EXIT_CODE:-0}

      - name: Archive ZIM
        uses: actions/upload-artifact@v7
        with:
          name: openZIM_testing.zim
          path: output/openZIM_testing.zim
          retention-days: 30

      - name: Run zimcheck
        run: docker run --rm -v $PWD/output:/output:ro ghcr.io/openzim/zim-tools:3.8.0 zimcheck --empty --checksum --integrity --metadata --favicon --main /output/openZIM_testing.zim

      - name: Run integration test suite
        run: docker run -v $PWD/scraper/tests-integration/integration.py:/src/scraper/tests-integration/integration.py -v $PWD/output:/output youtube2zim bash -c "pip install pytest; pytest -v /src/scraper/tests-integration/integration.py"

      - name: Cleanup docker
        if: always()
        run: docker system prune -af
